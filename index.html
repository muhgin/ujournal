<style>
/* Layout: one phone-width journal column — washi paper, ink type, a vermilion seal used sparingly. Single light look by choice. */
:root {
  --paper: #F8F6F1;
  --paper-deep: #EFECE5;
  --card: #FFFFFF;
  --ink: #1B1B1F;
  --ink-soft: #5F5E66;
  --ink-faint: #8A8890;
  --hair: #E2DDD3;
  --shu: #C8402B;        /* vermilion seal */
  --shu-text: #A8331F;
  --ai: #24407A;         /* indigo */
  --ai-wash: #EDF0F5;
  --ai-hair: #DCE3F0;
  --sketch: #A3A09A;
  --sketch-bg: #ECE9E4;
  --mincho: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
  --gothic: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
  color-scheme: light;
}
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--gothic); font-size: 15px; -webkit-font-smoothing: antialiased; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.app { max-width: 480px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }

/* header */
.top { padding-block: 20px 8px; display: flex; flex-direction: column; gap: 18px; border-bottom: 1px solid var(--hair); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand-name { display: flex; align-items: baseline; gap: 8px; }
.brand-name b { font-family: var(--mincho); font-size: 15px; letter-spacing: .2em; }
.brand-name span { font-size: 11px; font-weight: 500; letter-spacing: .22em; color: var(--ink-soft); }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.status i { width: 6px; height: 6px; border-radius: 6px; background: var(--shu); }
.dateline { display: flex; gap: 16px; align-items: center; }
.cal { width: 52px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-right: 16px; border-right: 1px solid var(--hair); }
.cal .mon { font-family: var(--mincho); font-size: 12px; letter-spacing: .1em; color: var(--shu-text); }
.cal .num { font-family: var(--mincho); font-size: 38px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.cal .seal { width: 22px; height: 22px; border-radius: 3px; background: var(--shu); color: #fff; font-family: var(--mincho); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.day-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .18em; color: var(--ink-soft); text-transform: uppercase; }
.day-info h1 { margin: 0; font-family: var(--mincho); font-size: 20px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); }
.city { color: var(--ai); border: 1px solid #C9D2E4; padding: 1px 8px; border-radius: 2px; font-weight: 500; }
.stay { display: flex; align-items: center; gap: 5px; min-width: 0; }

.tabs { display: flex; gap: 2px; overflow-x: auto; margin: 0 -20px; padding: 0 14px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; width: 46px; height: 74px; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 0; }
.tab .wd { font-family: var(--mincho); font-size: 12px; color: #6E6C70; }
.tab .n { font-family: var(--mincho); font-size: 17px; font-weight: 700; width: 32px; height: 32px; border-radius: 32px; display: flex; align-items: center; justify-content: center; transition: background .2s, color .2s; font-variant-numeric: tabular-nums; }
.tab .dot { width: 4px; height: 4px; border-radius: 4px; background: transparent; }
.tab.prep .n { color: var(--ink-soft); }
.tab[aria-current="date"] .wd { color: var(--shu-text); }
.tab[aria-current="date"] .n { background: var(--shu); color: #fff; }
.tab.done .dot { background: var(--ai); }
.depart { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 22px; }
.depart span { writing-mode: vertical-rl; font-family: var(--mincho); font-size: 10px; letter-spacing: .2em; color: var(--shu-text); }
.depart i { width: 1px; height: 14px; background: var(--hair); }

main { display: flex; flex-direction: column; gap: 24px; padding-top: 16px; }

/* checklist */
.check { background: var(--ai-wash); border-radius: 4px; overflow: hidden; }
.check-sum { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: transparent; border: none; text-align: left; min-height: 64px; }
.ring { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--ai); font-variant-numeric: tabular-nums; }
.check-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.check-txt b { font-size: 12px; letter-spacing: .08em; color: var(--ai); }
.check-txt span { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { width: 32px; height: 32px; border-radius: 16px; background: var(--card); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .2s; color: var(--ai); }
.open > .check-sum .chev { transform: rotate(180deg); }
.check-body { padding: 0 14px 8px; }
.check ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ai-hair); }
.check li { display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--ai-hair); }
.check input[type=checkbox] { width: 20px; height: 20px; margin: 0; accent-color: var(--ai); flex-shrink: 0; }
.check label { flex: 1; min-width: 0; font-size: 15px; padding: 12px 0; cursor: pointer; }
.check li.is-done label { color: var(--ink-faint); text-decoration: line-through; }
.opt { font-size: 11px; color: #4A5878; border: 1px solid #C9D2E4; border-radius: 4px; padding: 2px 6px; flex-shrink: 0; }
.rm { width: 44px; height: 44px; border: none; background: transparent; color: var(--ink-faint); display: flex; align-items: center; justify-content: center; margin-right: -12px; }
.add-task { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.add-task svg { color: var(--ai); flex-shrink: 0; }
.add-task input { flex: 1; min-width: 0; border: none; background: transparent; font-size: 15px; padding: 12px 0; }
.add-task input::placeholder { color: #4A5878; }

/* places */
.places-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; }
.places-head h2 { margin: 0; font-family: var(--mincho); font-size: 18px; letter-spacing: .04em; }
.save-day { border: none; background: transparent; color: var(--ink-soft); font-size: 12px; letter-spacing: .06em; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; }
.place { border-top: 1px solid var(--hair); }
.place:last-child { border-bottom: 1px solid var(--hair); }
.place-head { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 0; background: transparent; border: none; text-align: left; min-height: 72px; }
.fan { position: relative; width: 54px; height: 48px; flex-shrink: 0; }
.fan > span { position: absolute; top: 4px; width: 36px; height: 40px; box-sizing: border-box; border-radius: 2px; border: 3px solid #fff; border-bottom-width: 7px; box-shadow: 0 1px 2px rgba(27,27,31,.14); display: flex; align-items: center; justify-content: center; background: var(--sketch-bg); overflow: hidden; }
.fan > span:nth-child(1) { left: 16px; transform: rotate(6deg); z-index: 3; }
.fan > span:nth-child(2) { left: 9px; transform: rotate(-3deg); z-index: 2; }
.fan > span:nth-child(3) { left: 2px; transform: rotate(-11deg); z-index: 1; }
.fan img, .fan video { width: 100%; height: 100%; object-fit: cover; display: block; }
.place-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.place-txt b { font-family: var(--mincho); font-size: 16px; }
.place-txt span { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); }
.count { font-size: 12.5px; color: var(--ink-soft); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.place-head .arrow { display: flex; transition: transform .2s; color: var(--ink-soft); }
.place.is-open .place-head .arrow { transform: rotate(180deg); }
.panel { padding-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }

.stage { --pw: min(344px, 82vw); position: relative; height: calc(var(--pw) * 1.25); perspective: 1100px; overflow: hidden; background: transparent; }
.pg { position: absolute; top: 0; left: 50%; width: var(--pw); height: calc(var(--pw) * 1.25); margin-left: calc(var(--pw) / -2); transform-style: preserve-3d; transition: transform .4s ease, opacity .4s ease; }
.pg.playing .play { opacity: 0; }
.play { transition: opacity .3s; }
.pg-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .55s ease; }
.pg.flipped .pg-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; box-sizing: border-box; border-radius: 4px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0; box-shadow: 0 1px 3px rgba(27,27,31,.10); overflow: hidden; }
.front { background: var(--sketch-bg); padding: 0; justify-content: flex-start; gap: 0; border: none; box-shadow: 0 2px 10px rgba(27,27,31,.16); }
.front .ph svg { width: 56%; height: auto; }
.front .play svg { width: 22px; }
.hanko { position: absolute; right: 2px; bottom: 2px; z-index: 3; width: 17px; height: 17px; border-radius: 2px; background: var(--shu); color: #fff; font-family: var(--mincho); font-size: 10px; font-weight: 700; line-height: 1; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1.5px #FBF9F4; }
.front .badge { position: absolute; right: 10px; top: 10px; z-index: 2; width: 22px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.92); color: var(--shu-text); display: flex; align-items: center; justify-content: center; }
.keep { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
.keep input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--shu); flex-shrink: 0; }
.keep span { display: flex; flex-direction: column; gap: 2px; }
.keep small { font-size: 12px; color: var(--ink-soft); }
.front .ph { flex: 1; width: 100%; position: relative; background: var(--sketch-bg); color: var(--sketch); display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 1px; }
.front img, .front video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.front .play { position: relative; width: 52px; height: 52px; border-radius: 26px; background: rgba(27,27,31,.35); display: flex; align-items: center; justify-content: center; }
.pcap { height: 32px; width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; font-family: var(--mincho); font-size: 12.5px; font-weight: 700; color: var(--ink); }
.pcap em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pcap .pin { color: var(--shu-text); display: flex; flex-shrink: 0; }
.front.add { padding: 0; justify-content: center; gap: 12px; border: 1.5px dashed #C9C4BC; background: rgba(255,255,255,.6); color: var(--shu-text); font-size: 13px; font-weight: 700; }
.stage { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.stage img, .stage video { -webkit-user-drag: none; pointer-events: none; }
.back { transform: rotateY(180deg); background: #fff; border: 8px solid #fff; justify-content: flex-start; gap: 8px; }
.mini { width: 100%; flex: 1; min-height: 0; border-radius: 2px; overflow: hidden; background: #ECE8E0; position: relative; display: block; }
.mini-go { position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; border-radius: 15px; background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(27,27,31,.2); }
.mini svg { display: block; width: 100%; height: 100%; }
.back-txt { width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: left; }
.back-txt b { font-family: var(--mincho); font-size: 13.5px; line-height: 1.25; }
.back-txt span { font-size: 11.5px; color: var(--ink-soft); }
.back-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; width: 100%; margin-top: auto; }
.back-map { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; border: 1px solid var(--hair); border-radius: 3px; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 500; }
.icon-btn { width: 44px; height: 44px; border: 1px solid var(--hair); border-radius: 3px; background: transparent; display: flex; align-items: center; justify-content: center; }
.shoot { min-height: 44px; border: none; border-radius: 3px; background: var(--shu); color: #fff; font-size: 14px; font-weight: 700; }

.flip-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px; }
.nav-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--hair); background: transparent; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.nav-btn:disabled { color: #C9C4BC; cursor: default; }
.cap { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-height: 52px; justify-content: center; }
.cap-t { display: flex; align-items: center; justify-content: center; gap: 2px; max-width: 100%; }
.cap-t b { font-family: var(--mincho); font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap > span { font-size: 12.5px; line-height: 1.45; color: var(--ink-soft); text-wrap: balance; }
.pen { width: 36px; height: 36px; margin: -4px -8px -4px 0; border: none; background: transparent; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cap-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.cap-form input, .cap-form textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--hair); border-radius: 3px; background: var(--card); padding: 8px 10px; font-size: 14px; resize: none; }
.cap-form input { font-family: var(--mincho); font-weight: 700; }
.cap-form textarea { font-size: 13px; line-height: 1.4; }
.cap-btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.cap-btns button { min-height: 40px; border-radius: 3px; border: 1px solid var(--hair); background: transparent; font-size: 14px; }
.cap-btns button[type=submit] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
.flip-nav.editing .nav-btn { display: none; }

/* overlays */
.scrim { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; }
.scrim-bg { position: absolute; inset: 0; background: rgba(27,27,31,.42); border: none; }
.sheet { position: relative; background: var(--card); border-radius: 6px 6px 0 0; padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; max-width: 480px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.grip { width: 40px; height: 4px; border-radius: 4px; background: #D8D4CD; align-self: center; }
.sheet h3 { margin: 0; font-family: var(--mincho); font-size: 18px; }
.sheet .sub { font-size: 13px; color: var(--ink-soft); }
.idea-chip { align-self: flex-start; font-size: 12.5px; background: var(--paper-deep); padding: 5px 10px; border-radius: 3px; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opt-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px 6px; border-radius: 4px; border: 1px solid var(--hair); background: var(--card); min-height: 108px; font-size: 13px; font-weight: 700; text-align: center; }
.opt-btn svg { width: 38px; height: 38px; }
.opt-btn.primary { background: var(--shu); border-color: var(--shu); color: #fff; }
.limit { font-size: 12px; color: var(--ink-soft); }

.lightbox { position: fixed; inset: 0; z-index: 40; background: #121214; display: flex; flex-direction: column; color: #fff; }
.lb-top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.lb-icons { display: flex; gap: 6px; flex-shrink: 0; }
.lb-ic { width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,.10); color: #fff; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: background .2s; }
.lb-ic.armed { background: var(--shu); }
.lb-close { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 28px; border: none; background: #fff; color: #121214; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.4); z-index: 2; }
.lb-top b { flex: 1; min-width: 0; font-family: var(--mincho); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-x { width: 44px; height: 44px; border: none; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center; }
.lb-media { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.lb-media img, .lb-media video { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb-bar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb-bar button { min-height: 48px; border-radius: 4px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; font-size: 15px; font-weight: 500; }
.lb-bar button.warn { border-color: #E07A66; color: #F3B2A4; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50; width: min(440px, calc(100% - 40px)); background: var(--ink); color: #fff; border-radius: 4px; padding: 13px 16px; font-size: 14px; display: flex; align-items: center; gap: 10px; box-sizing: border-box; }
.notice { font-size: 12.5px; color: var(--ink-soft); background: var(--paper-deep); padding: 10px 12px; border-radius: 3px; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.signin { background: var(--card); border: 1px solid var(--hair); border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.signin b { font-family: var(--mincho); font-size: 17px; }
.signin span { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
.signin-btn { align-self: flex-start; min-height: 44px; padding: 0 20px; border-radius: 22px; border: 1px solid var(--hair); background: #fff; font-size: 15px; font-weight: 500; }
.who { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 4px 0 0; }
.link { border: none; background: none; color: var(--ai); font-size: 12px; padding: 10px 4px; text-decoration: underline; }
.front .by { position: absolute; left: 10px; bottom: 10px; z-index: 3; font-size: 11px; font-weight: 700; color: #fff; background: rgba(27,27,31,.45); padding: 3px 8px; border-radius: 10px; }
.front img.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.front video { z-index: 1; opacity: 0; transition: opacity .3s; }
.pg.playing .front video { opacity: 1; }
.front .play { z-index: 2; }
.lb-frame { width: 100%; height: 100%; border: 0; background: #000; }
.mini .mini-static { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.lmap { position: absolute; inset: 0; pointer-events: none; background: transparent; z-index: 1; }
.lmap.live { background: #ECE8E0; }

.ro-list { list-style: none; margin: 0; padding: 0; }

.ro-row.dragging { box-shadow: 0 6px 18px rgba(0,0,0,.12); position: relative; z-index: 5; }
.grip { touch-action: none; cursor: grab; width: 40px; height: 44px; display: grid; place-items: center; color: var(--ink-soft); }
.ro-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ro-txt b { font-family: var(--mincho); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ro-txt span { font-size: 12px; color: var(--ink-soft); }

.ro-ic[data-armed] { background: #C8402B; color: #fff; border-color: #C8402B; }

.addp input { min-height: 44px; border: 1px solid var(--hair); border-radius: 4px; padding: 0 12px; font-size: 16px; background: #fff; }

.cm b { font-weight: 700; margin-right: 5px; }
.cm.out { opacity: 0; transform: translateY(-8px); }

function placeMedia(k) { return media.filter(function (m) { return m.key === k; }).sort(function (a, b) { return a.takenAt - b.takenAt; }); }

function buildPages(d, j) {

  return pages;

function layoutStage(k) {

  }
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();
setInterval(function () { if (document.visibilityState === 'visible' && signedIn() && !ui.reorder) loadPlaces(); }, 45000);

document.addEventListener('click', function (e) {
  if (signedIn() || !remembered() || auth.renewFailed) return;
  var b = e.target.closest && e.target.closest('[data-act]');
  if (b && (b.getAttribute('data-act') === 'signin' || b.getAttribute('data-act') === 'signout')) return;
  renew();
}, true);
(function () { if (!remembered()) return; try { var c = JSON.parse(localStorage.getItem('jj-media') || 'null'); if (c && c.length) media = c; } catch (e) {} })();
renderAll();
if (signedIn()) onSignedIn();
window.addEventListener('load', function () { initGis(); });
})();

</script>
</body>
